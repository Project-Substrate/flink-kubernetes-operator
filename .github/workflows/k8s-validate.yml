name: k8s validate
permissions:
  contents: read

on:
  pull_request:
    paths: ['k8s/**', '**/k8s/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: magnon-enterprise-runners
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: kustomize build all overlays
      run: |
        for repo in */; do
          if [ -d "$repo/k8s/overlays" ]; then
            for overlay in "$repo/k8s/overlays"/*/; do
              kustomize build "$overlay" > /dev/null
            done
          fi
        done
    - name: kustomize build base
      run: kustomize build k8s/base > /dev/null
