apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flink-operator
commonLabels:
  app.kubernetes.io/managed-by: argocd
  app.kubernetes.io/part-of: magnon-platform
  magnon.io/project: substrate
resources:
- grafana-provisioning-dashboards.yaml
- grafana-provisioning-datasources.yaml
- namespace-limitrange.yaml
- hpa.yaml
- namespace.yaml
- serviceaccount.yaml
- clusterrole.yaml
- configmap.yaml
- deployment.yaml
- service.yaml
- servicemonitor.yaml
- networkpolicy.yaml
- ciliumnetworkpolicy.yaml
- default-deny-cilium.yaml
- pdb.yaml
- resourcequota.yaml
- prometheus-rules.yaml
- grafana-dashboard.yaml
- authorizationpolicy.yaml
- virtualservice.yaml
- peer-authentication.yaml
images:
- name: ghcr.io/project-substrate/flink-kubernetes-operator
  newTag: latest
