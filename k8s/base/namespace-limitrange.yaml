apiVersion: v1
kind: LimitRange
metadata:
  name: flink-operator-limits
  namespace: flink-operator
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "8"
        memory: 32Gi
      min:
        cpu: 10m
        memory: 32Mi
